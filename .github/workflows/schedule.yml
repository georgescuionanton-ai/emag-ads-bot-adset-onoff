name: eMAG Ads Auto Scheduler

on:
  schedule:
    # Cron-urile sunt in UTC; orele duble acopera ora de vara si de iarna.
    - cron: '35,50 15,16 * * *'  # ~18:35 / 18:50 RO (start, in fiecare zi)
    - cron: '5,35 22,23 * * *'   # ~01:05 / 01:35 RO (oprire)
    - cron: '5 0,1 * * *'        # ~03:05 RO (rezerva oprire)
    # Fereastra larga / BF: START ~10:00 RO (UTC+3 → 07:xx, UTC+2 → 08:xx)
    - cron: '35 7 * * *'         # ~10:35 RO vara (UTC+3) / ~09:35 RO iarna
    - cron: '5,35 8 * * *'       # ~10:05+ RO iarna (UTC+2); backup vara
    # BF (6 nov) + rezerva diurna: START pe timpul zilei (in afara BF decide() → PAUSE, inofensiv)
    - cron: '5 9,11 * * *'       # ~12:05 / 14:05 RO vara; ~11:05 / 13:05 RO iarna
  workflow_dispatch:
    inputs:
      action:
        type: choice
        options: [AUTO, START, PAUSE]
        default: AUTO

jobs:
  run-emag-toggle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm install puppeteer

      - name: Decide actiunea dupa ziua si ora Bucuresti
        id: act
        run: |
          # Reguli detaliate (BF, fereastra larga, weekend): vezi decide_action.js (comentarii RO).
          MODE="${{ github.event_name == 'workflow_dispatch' && inputs.action || 'AUTO' }}"
          if [ "$MODE" != "AUTO" ]; then
            echo "action=$MODE" >> $GITHUB_OUTPUT
            echo "Mod manual: $MODE"
          else
            ACTION=$(node decide_action.js)
            echo "action=$ACTION" >> $GITHUB_OUTPUT
            echo "AUTO → $ACTION  ($(TZ=Europe/Bucharest date '+%Y-%m-%d %H:%M %Z'))"
          fi

      - name: Executare
        run: node emag_toggle.js ${{ steps.act.outputs.action }}
        env:
          EMAG_USER: ${{ secrets.EMAG_USER }}
          EMAG_PASS: ${{ secrets.EMAG_PASS }}

      - name: Salvare screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: '*.png'
          if-no-files-found: ignore
