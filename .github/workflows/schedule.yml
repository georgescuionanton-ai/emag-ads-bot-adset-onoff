name: eMAG Ads Auto Scheduler

on:
  schedule:
    # Cron-urile sunt in UTC; orele duble acopera ora de vara si de iarna.
    - cron: '5,35 11,12 * * *'   # ~14:05 / 14:35 RO (start weekend)
    - cron: '5,35 15,16 * * *'   # ~18:05 / 18:35 RO (start zile lucratoare)
    - cron: '5,35 22,23 * * *'   # ~01:05 / 01:35 RO (oprire)
    - cron: '5 0,1 * * *'        # ~03:05 RO (rezerva oprire)
  workflow_dispatch:
    inputs:
      action:
        type: choice
        options: [AUTO, START, PAUSE]
        default: AUTO

jobs:
  run-emag-toggle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm install puppeteer

      - name: Decide actiunea dupa ziua si ora Bucuresti
        id: act
        run: |
          MODE="${{ github.event_name == 'workflow_dispatch' && inputs.action || 'AUTO' }}"
          if [ "$MODE" != "AUTO" ]; then
            echo "action=$MODE" >> $GITHUB_OUTPUT
          else
            H=$(TZ=Europe/Bucharest date +%-H)
            D=$(TZ=Europe/Bucharest date +%u)   # 1=luni ... 7=duminica
            if [ "$D" -ge 6 ]; then START_H=14; else START_H=18; fi
            if [ "$H" -ge "$START_H" ] || [ "$H" -lt 1 ]; then
              echo "action=START" >> $GITHUB_OUTPUT
            else
              echo "action=PAUSE" >> $GITHUB_OUTPUT
            fi
            echo "Ziua=$D Ora=$H StartH=$START_H"
          fi

      - name: Executare
        run: node emag_toggle.js ${{ steps.act.outputs.action }}
        env:
          EMAG_USER: ${{ secrets.EMAG_USER }}
          EMAG_PASS: ${{ secrets.EMAG_PASS }}

      - name: Salvare screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: '*.png'
          if-no-files-found: ignore
