name: eMAG Ads Auto Scheduler

# Program curent, Europe/Bucharest: anunturile stau pornite toata ziua.
# Nu exista cron de START dimineata si nici de STOP la 01:00. Un cron nu
# opreste anunturile. Regulile vechi (inainte de 16 nov 2026) raman doar
# in decide_action.js, pentru istoric; nu mai au cron.
#
# Singurele cron-uri acopera reluarea de la 18:30 dupa un PAUSE_UNTIL_EVENING
# manual. Daca nu exista hold de buget, cron-ul nu comuta nimic. Daca hold-ul
# e inca inainte de 18:30, cron-ul nu porneste anunturile (pauza manuala
# ramane). La 18:30 sau dupa, daca hold-ul e al zilei, cron-ul porneste
# allowlist-ul si sterge hold-ul. O intarziere de ~55 min tot prinde reluarea.
#
# START (manual sau reluarea de la 18:30) porneste doar allowlist-ul din
# targets.js. "Imprimante others" si "Cartus_*" nu se pornesc niciodata.
# PAUSE le poate opri.
#
# Fus: fiecare cron are timezone Europe/Bucharest. In noiembrie RO este
# UTC+2 (EET); vara UTC+3 (EEST). GitHub muta cron-ul la schimbarea orei.
# 18:30 RO = 16:30 UTC iarna si 15:30 UTC vara. Ora din cron ramane locala.
# La primavara, ora 03:00–03:59 nu exista; nu programam nimic in ora 03.
# Decizia foloseste Intl Europe/Bucharest, nu un offset fix.
#
# Run workflow — dupa merge, branch: main. Un singur input, "action":
#   AUTO                 = 24h pornit, sau pauza daca hold-ul e inca activ
#   START                = porneste acum si sterge hold-ul de buget
#   PAUSE                = opreste acum, FARA hold (ramane oprit pana la START)
#   PAUSE_UNTIL_EVENING  = opreste si tine oprit pana la 18:30 RO azi
# Pentru plafonul de buget, inainte de 18:30: action = PAUSE_UNTIL_EVENING.
# Dupa 18:30 acelasi input este doar o oprire punctuala (nu seteaza hold).
# Hold-ul este artifactul Actions "emag-hold", nu o variabila de repo.

run-name: eMAG Ads ${{ github.event_name == 'workflow_dispatch' && inputs.action || 'AUTO' }}

on:
  schedule:
    # Orele de mai jos sunt Europe/Bucharest, nu UTC.
    # Doar reluarea dupa PAUSE_UNTIL_EVENING. Fara hold, cron-ul iese inainte
    # de browser si nu porneste si nu opreste nimic.
    # In jurul lui 18:30: ~50 si ~40 min inainte (intarziate, aterizeaza dupa
    # prag), cateva minute inainte, apoi 18:37 si 18:48. 19:12 si 19:47
    # prind reluarea daca GitHub sare ora 18.
    # 18:30 RO = 16:30 UTC iarna (UTC+2) si 15:30 UTC vara (UTC+3).

    # --- 18:30 RO: reluare doar daca hold-ul de buget a ajuns la expirare ---
    - cron: '12,42,52 17 * * *'
      timezone: 'Europe/Bucharest'
    - cron: '8,17,27,37,48 18 * * *'
      timezone: 'Europe/Bucharest'
    - cron: '12,47 19 * * *'
      timezone: 'Europe/Bucharest'

  workflow_dispatch:
    inputs:
      action:
        description: >
          AUTO = 24h pornit, sau respecta un hold activ. START = porneste acum si sterge hold-ul.
          PAUSE = opreste acum, fara hold (ramane oprit pana la un START manual).
          PAUSE_UNTIL_EVENING = opreste si tine oprit pana la 18:30 azi (plafon de buget; de folosit inainte de 18:30).
        type: choice
        options:
          - AUTO
          - START
          - PAUSE
          - PAUSE_UNTIL_EVENING
        default: AUTO

# O singura rulare o data: doua browsere pe aceleasi comutatoare s-ar calca.
# O rulare in desfasurare nu e anulata; cele in asteptare sunt inlocuite de
# ultima, care decide dupa ora la care porneste efectiv.
concurrency:
  group: emag-ads-auto-scheduler
  cancel-in-progress: false

# contents: read e de ajuns pentru checkout. Hold-ul nu se comite pe main
# (branch protection / GITHUB_TOKEN nu scrie variabile de repo); sta in
# artifactul emag-hold, deci e nevoie de actions: write.
permissions:
  contents: read
  actions: write

jobs:
  run-emag-toggle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Decide actiunea si pregateste hold-ul pana la 18:30
        id: act
        env:
          TZ: Europe/Bucharest
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.action || 'AUTO' }}
          EVENT: ${{ github.event_name }}
        run: node persist_hold.js

      - name: Salveaza hold-ul (artifact emag-hold)
        id: save
        if: steps.act.outputs.persist == 'true'
        continue-on-error: ${{ steps.act.outputs.persist_required != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: emag-hold
          path: hold-out/hold.json
          retention-days: 3
          if-no-files-found: error

      - name: Hold-ul obligatoriu nu a fost salvat
        if: steps.act.outputs.persist_required == 'true' && steps.save.outcome != 'success'
        run: |
          echo "Nu am salvat hold-ul. Nu comut anunturile, ca un cron urmator sa nu le reporneasca peste o pauza de buget (sau sa le tina oprite dupa START)."
          exit 1

      - name: Instaleaza puppeteer
        if: steps.act.outputs.skip != 'true' && (steps.act.outputs.persist_required != 'true' || steps.save.outcome == 'success')
        run: npm install puppeteer

      - name: Executare
        if: steps.act.outputs.skip != 'true' && (steps.act.outputs.persist_required != 'true' || steps.save.outcome == 'success')
        run: node emag_toggle.js ${{ steps.act.outputs.action }}
        env:
          EMAG_USER: ${{ secrets.EMAG_USER }}
          EMAG_PASS: ${{ secrets.EMAG_PASS }}

      - name: Salvare screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: '*.png'
          if-no-files-found: ignore
