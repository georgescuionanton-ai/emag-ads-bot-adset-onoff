name: eMAG Ads Auto Scheduler

on:
  schedule:
    - cron: '5 15,16 * * *'    # ~18:05 RO (pornire)
    - cron: '35 15,16 * * *'   # ~18:35 RO (rezerva)
    - cron: '5 23,0 * * *'     # ~02:05 RO (oprire)
    - cron: '35 23,0 * * *'    # ~02:35 RO (rezerva)
    - cron: '5 1,2 * * *'      # ~04:05 RO (rezerva tarzie)
  workflow_dispatch:
    inputs:
      action:
        type: choice
        options: [AUTO, START, PAUSE]
        default: AUTO

jobs:
  run-emag-toggle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm install puppeteer

      - name: Decide actiunea dupa ora Bucuresti
        id: act
        run: |
          MODE="${{ github.event_name == 'workflow_dispatch' && inputs.action || 'AUTO' }}"
          if [ "$MODE" != "AUTO" ]; then
            echo "action=$MODE" >> $GITHUB_OUTPUT
          else
            H=$(TZ=Europe/Bucharest date +%-H)
            if [ "$H" -ge 18 ] || [ "$H" -lt 2 ]; then
              echo "action=START" >> $GITHUB_OUTPUT
            else
              echo "action=PAUSE" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Executare
        run: node emag_toggle.js ${{ steps.act.outputs.action }}
        env:
          EMAG_USER: ${{ secrets.EMAG_USER }}
          EMAG_PASS: ${{ secrets.EMAG_PASS }}

      - name: Salvare screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: '*.png'
          if-no-files-found: ignore
