name: eMAG Ads Auto Scheduler

on:
  schedule:
    # Cron-urile sunt in UTC. In noiembrie 2026 Romania e UTC+2 (EET).
    # Programul normal (18:30 / 01:00) pastreaza orele duble, ca sa acopere
    # si ora de vara (UTC+3) dupa ce fereastra larga se termina.
    # Rulari cazute in afara ferestrei sunt inofensive: decide() → PAUSE.

    # Fereastra larga — START ~11:00–11:05 RO + rezerva ~30 min
    - cron: '5,35 9 * * *'       # 09:05/09:35 UTC → ~11:05 / ~11:35 RO
    # Fereastra larga — PAUSE ~14:00–14:05 RO + rezerva ~30 min
    - cron: '5,35 12 * * *'      # 12:05/12:35 UTC → ~14:05 / ~14:35 RO
    # Fereastra larga — START ~19:00–19:05 RO + rezerva ~30 min
    - cron: '5,35 17 * * *'      # 17:05/17:35 UTC → ~19:05 / ~19:35 RO

    # Program normal (din 16 nov): START ~18:35 / ~18:50 RO
    - cron: '35,50 15,16 * * *'  # iarna 16:35/16:50 UTC; vara 15:35/15:50 UTC
    # Oprire ~01:05 RO + rezerva ~01:35; inca o rezerva ~03:05
    - cron: '5,35 22,23 * * *'   # ~01:05 / ~01:35 RO (iarna: 23:xx UTC; vara: 22:xx UTC)
    - cron: '5 0,1 * * *'        # ~03:05 RO (rezerva oprire)
  workflow_dispatch:
    inputs:
      action:
        type: choice
        options: [AUTO, START, PAUSE]
        default: AUTO

jobs:
  run-emag-toggle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm install puppeteer

      - name: Decide actiunea dupa ziua si ora Bucuresti
        id: act
        run: |
          # Reguli detaliate (BF, fereastra larga 11–14 si 19–01, weekend): vezi decide_action.js.
          MODE="${{ github.event_name == 'workflow_dispatch' && inputs.action || 'AUTO' }}"
          if [ "$MODE" != "AUTO" ]; then
            echo "action=$MODE" >> $GITHUB_OUTPUT
            echo "Mod manual: $MODE"
          else
            ACTION=$(node decide_action.js)
            echo "action=$ACTION" >> $GITHUB_OUTPUT
            echo "AUTO → $ACTION  ($(TZ=Europe/Bucharest date '+%Y-%m-%d %H:%M %Z'))"
          fi

      - name: Executare
        run: node emag_toggle.js ${{ steps.act.outputs.action }}
        env:
          EMAG_USER: ${{ secrets.EMAG_USER }}
          EMAG_PASS: ${{ secrets.EMAG_PASS }}

      - name: Salvare screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: '*.png'
          if-no-files-found: ignore
