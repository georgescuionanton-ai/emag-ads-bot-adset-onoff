name: eMAG Ads Auto Scheduler

on:
  schedule:
    # Ora 18:00 (România) = 15:00 UTC
    - cron: '0 15 * * *'
    # Ora 01:00 (România) = 22:00 UTC
    - cron: '0 22 * * *'
  workflow_dispatch:

jobs:
  run-emag-toggle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Instalare Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Instalare Puppeteer
        run: npm install puppeteer

      - name: Executare Pornire (Ora 18:00)
        if: github.event.schedule == '0 15 * * *' || github.event_name == 'workflow_dispatch'
        run: node emag_toggle.js START
        env:
          EMAG_USER: ${{ secrets.EMAG_USER }}
          EMAG_PASS: ${{ secrets.EMAG_PASS }}

      - name: Executare Oprire (Ora 01:00)
        if: github.event.schedule == '0 22 * * *'
        run: node emag_toggle.js PAUSE
        env:
          EMAG_USER: ${{ secrets.EMAG_USER }}
          EMAG_PASS: ${{ secrets.EMAG_PASS }}
