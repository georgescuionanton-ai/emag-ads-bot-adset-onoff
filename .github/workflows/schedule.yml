name: eMAG Ads Auto Scheduler

# Program din 2026-11-16, in fiecare zi, Europe/Bucharest:
#   ON  11:00 inclusiv → 01:00 exclusiv (trece de miezul noptii)
#   OFF 01:00 inclusiv → 11:00 exclusiv
# Nu mai exista pauza la 14:00. Inainte de 16 nov raman regulile vechi
# (Black Friday si ferestrele 11:00–14:00 / 19:00–01:00), in decide_action.js.
#
# Decizia AUTO foloseste ora reala din Bucuresti, nu minutul din cron.
# O rulare intarziata sau repetata este idempotenta.
#
# GitHub a sarit, in 10–15 nov 2026, peste cron-urile dintre ~10:30 si ~17:00 RO
# (nu apare nicio rulare). Rezervele de dimineata / dupa-amiaza acopera
# intarzieri de ~55 min in jurul pragurilor si, daca toata fereastra e sarita,
# prima rulare care chiar porneste (de obicei dupa 17:00) aplica starea corecta.
# Un hold de buget blocheaza repornirea pana la 18:30.
#
# Fus: fiecare cron are timezone Europe/Bucharest. In noiembrie RO este
# UTC+2 (EET); vara UTC+3 (EEST). GitHub muta cron-ul la schimbarea orei.
# La primavara, ora 03:00–03:59 nu exista; nu programam nimic in ora 03.
# Decizia foloseste Intl Europe/Bucharest, nu un offset fix.
#
# Run workflow — dupa merge, branch: main. Un singur input, "action":
#   AUTO                 = dupa ora Bucuresti
#   START                = porneste acum si sterge hold-ul de buget
#   PAUSE                = opreste acum, FARA hold (urmatorul cron poate reporni)
#   PAUSE_UNTIL_EVENING  = opreste si tine oprit pana la 18:30 RO azi
# Pentru plafonul de buget, inainte de 18:30: action = PAUSE_UNTIL_EVENING.
# Dupa 18:30 acelasi input este doar o oprire punctuala (nu seteaza hold).
# Hold-ul este artifactul Actions "emag-hold", nu o variabila de repo.

run-name: eMAG Ads ${{ github.event_name == 'workflow_dispatch' && inputs.action || 'AUTO' }}

on:
  schedule:
    # Orele de mai jos sunt Europe/Bucharest, nu UTC.
    # In jurul fiecarui prag (01:00 PAUSE, 11:00 START, 18:30 reluare):
    #   ~50 si ~30 min inainte (la timp reafirma starea; intarziate, aterizeaza
    #   imediat dupa prag), ~8 min inainte, si doua rulari la cateva minute dupa.
    # Intre 11:00 si 18:30 sunt rezerve din ora in ora: daca GitHub sarea toata
    # dimineata, prima rulare care prinde totusi aplica START, iar un hold de
    # buget le tine pe PAUSE pana la 18:30.

    # --- 01:00 RO PAUSE, apoi reafirmare OFF pana la 11:00 ---
    - cron: '12,32,42,52 0 * * *'
      timezone: 'Europe/Bucharest'
    - cron: '7,18 1 * * *'
      timezone: 'Europe/Bucharest'
    - cron: '17 2 * * *'
      timezone: 'Europe/Bucharest'
    - cron: '22 4 * * *'
      timezone: 'Europe/Bucharest'
    - cron: '47 5 * * *'
      timezone: 'Europe/Bucharest'
    - cron: '17 7 * * *'
      timezone: 'Europe/Bucharest'
    - cron: '42 8 * * *'
      timezone: 'Europe/Bucharest'
    - cron: '17 9 * * *'
      timezone: 'Europe/Bucharest'

    # --- 11:00 RO START + rezerve prin dupa-amiaza (inainte de 18:30) ---
    - cron: '12,32,42,52 10 * * *'
      timezone: 'Europe/Bucharest'
    - cron: '7,18 11 * * *'
      timezone: 'Europe/Bucharest'
    - cron: '17 12 * * *'
      timezone: 'Europe/Bucharest'
    - cron: '22 13 * * *'
      timezone: 'Europe/Bucharest'
    - cron: '17 14 * * *'
      timezone: 'Europe/Bucharest'
    - cron: '22 15 * * *'
      timezone: 'Europe/Bucharest'
    - cron: '17,47 16 * * *'
      timezone: 'Europe/Bucharest'
    - cron: '12,42,52 17 * * *'
      timezone: 'Europe/Bucharest'

    # --- 18:30 RO START (reluare dupa hold-ul de buget; altfel deja pornit) ---
    - cron: '8,17,27,37,48 18 * * *'
      timezone: 'Europe/Bucharest'
    - cron: '12,47 19 * * *'
      timezone: 'Europe/Bucharest'
    - cron: '17 20 * * *'
      timezone: 'Europe/Bucharest'
    - cron: '40 21 * * *'
      timezone: 'Europe/Bucharest'
    - cron: '22 22 * * *'
      timezone: 'Europe/Bucharest'
    - cron: '17 23 * * *'
      timezone: 'Europe/Bucharest'

  workflow_dispatch:
    inputs:
      action:
        description: >
          AUTO = dupa ora Bucuresti. START = porneste acum si sterge hold-ul.
          PAUSE = opreste acum, fara hold (cron-ul urmator poate reporni).
          PAUSE_UNTIL_EVENING = opreste si tine oprit pana la 18:30 azi (plafon de buget; de folosit inainte de 18:30).
        type: choice
        options:
          - AUTO
          - START
          - PAUSE
          - PAUSE_UNTIL_EVENING
        default: AUTO

# O singura rulare o data: doua browsere pe aceleasi comutatoare s-ar calca.
# O rulare in desfasurare nu e anulata; cele in asteptare sunt inlocuite de
# ultima, care decide dupa ora la care porneste efectiv.
concurrency:
  group: emag-ads-auto-scheduler
  cancel-in-progress: false

# contents: read e de ajuns pentru checkout. Hold-ul nu se comite pe main
# (branch protection / GITHUB_TOKEN nu scrie variabile de repo); sta in
# artifactul emag-hold, deci e nevoie de actions: write.
permissions:
  contents: read
  actions: write

jobs:
  run-emag-toggle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Decide actiunea si pregateste hold-ul pana la 18:30
        id: act
        env:
          TZ: Europe/Bucharest
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.action || 'AUTO' }}
        run: node persist_hold.js

      - name: Salveaza hold-ul (artifact emag-hold)
        id: save
        if: steps.act.outputs.persist == 'true'
        continue-on-error: ${{ steps.act.outputs.persist_required != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: emag-hold
          path: hold-out/hold.json
          retention-days: 3
          if-no-files-found: error

      - name: Hold-ul obligatoriu nu a fost salvat
        if: steps.act.outputs.persist_required == 'true' && steps.save.outcome != 'success'
        run: |
          echo "Nu am salvat hold-ul. Nu comut anunturile, ca un cron urmator sa nu le reporneasca peste o pauza de buget (sau sa le tina oprite dupa START)."
          exit 1

      - name: Instaleaza puppeteer
        if: steps.act.outputs.persist_required != 'true' || steps.save.outcome == 'success'
        run: npm install puppeteer

      - name: Executare
        if: steps.act.outputs.persist_required != 'true' || steps.save.outcome == 'success'
        run: node emag_toggle.js ${{ steps.act.outputs.action }}
        env:
          EMAG_USER: ${{ secrets.EMAG_USER }}
          EMAG_PASS: ${{ secrets.EMAG_PASS }}

      - name: Salvare screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: '*.png'
          if-no-files-found: ignore
