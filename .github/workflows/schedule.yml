name: eMAG Ads Auto Scheduler

on:
  schedule:
    # Cron-urile sunt in UTC; orele duble acopera ora de vara si de iarna.
    - cron: '35,50 15,16 * * *'  # ~18:35 / 18:50 RO (start, in fiecare zi)
    - cron: '5,35 22,23 * * *'   # ~01:05 / 01:35 RO (oprire)
    - cron: '5 0,1 * * *'        # ~03:05 RO (rezerva oprire)
  workflow_dispatch:
    inputs:
      action:
        type: choice
        options: [AUTO, START, PAUSE]
        default: AUTO

jobs:
  run-emag-toggle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm install puppeteer

      - name: Decide actiunea dupa ziua si ora Bucuresti
        id: act
        run: |
          MODE="${{ github.event_name == 'workflow_dispatch' && inputs.action || 'AUTO' }}"
          if [ "$MODE" != "AUTO" ]; then
            echo "action=$MODE" >> $GITHUB_OUTPUT
          else
            read H M D < <(TZ=Europe/Bucharest date '+%-H %-M %u')   # D: 1=luni ... 7=duminica
            NOW=$((H * 60 + M))                                      # minute de la miezul noptii
            START=$((18 * 60 + 30))                                  # 18:30 in fiecare zi
            # Pentru alta ora in weekend, decomenteaza linia de mai jos (ex. 17:00):
            # if [ "$D" -ge 6 ]; then START=$((17 * 60)); fi
            if [ "$NOW" -ge "$START" ] || [ "$H" -lt 1 ]; then
              echo "action=START" >> $GITHUB_OUTPUT
            else
              echo "action=PAUSE" >> $GITHUB_OUTPUT
            fi
            echo "Ziua=$D Ora=$H:$M Start=$((START / 60)):$((START % 60))"
          fi

      - name: Executare
        run: node emag_toggle.js ${{ steps.act.outputs.action }}
        env:
          EMAG_USER: ${{ secrets.EMAG_USER }}
          EMAG_PASS: ${{ secrets.EMAG_PASS }}

      - name: Salvare screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: '*.png'
          if-no-files-found: ignore
