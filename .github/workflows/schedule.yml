name: eMAG Ads Auto Scheduler

on:
  schedule:
    - cron: '0 15 * * *'
    - cron: '0 22 * * *'
  workflow_dispatch:

jobs:
  run-emag-toggle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalare Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalare Puppeteer
        run: npm install puppeteer

      - name: Executare Toggle
        run: node emag_toggle.js START
        env:
          EMAG_USER: ${{ secrets.EMAG_USER }}
          EMAG_PASS: ${{ secrets.EMAG_PASS }}

      - name: Salvare Screenshots (la esec sau succes)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: '*.png'
          if-no-files-found: ignore
